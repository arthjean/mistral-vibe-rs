name: Mistral Vibe RS
description: Install and run the signed native Mistral Vibe RS artifact
author: Arthur Jean

# The inputs the reference action declares, under the same names, requirements
# and defaults (`action.yml` in the reference checkout), followed by the ones
# this port adds. A workflow written for the reference runs unchanged.
inputs:
  prompt:
    description: The prompt to pass to the agent
    required: true
    default: |
      You are a helpful assistant
  MISTRAL_API_KEY:
    description: Mistral API credential
    required: true
  install_python:
    description: |
      Whether or not to install Python
    required: true
    default: "true"
  python_version:
    description: |
      Version of Python to install
    required: false
  approvals:
    description: Approval policy, either ask or always
    required: false
    default: ask
  version:
    description: Mistral Vibe RS release version
    required: false
    default: "2.24.0"
  release_base_url:
    description: Optional HTTPS release asset base URL
    required: false

outputs:
  result:
    description: What the agent printed
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    # The reference guards its default-version step with a string compared to a
    # boolean, which never holds, so the one Python it ever installs is the
    # requested one, and only when both inputs are non-empty.
    - name: Install Requested Python Version
      if: inputs.install_python && inputs.python_version
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install signed native binaries
      shell: bash
      env:
        VIBE_VERSION: ${{ inputs.version }}
        VIBE_RELEASE_BASE_URL: ${{ inputs.release_base_url }}
        VIBE_INSTALL_DIR: ${{ runner.temp }}/mistral-vibe-rs/bin
        VIBE_COMPLETION_DIR: ${{ runner.temp }}/mistral-vibe-rs/completions
      run: |
        if [[ -z "${VIBE_RELEASE_BASE_URL}" ]]; then
          unset VIBE_RELEASE_BASE_URL
        fi
        sh "${{ github.action_path }}/scripts/install.sh"
        echo "${VIBE_INSTALL_DIR}" >> "${GITHUB_PATH}"

    - name: Run Mistral Vibe RS
      id: run
      shell: bash
      env:
        MISTRAL_API_KEY: ${{ inputs.MISTRAL_API_KEY }}
        PROMPT_INPUT: ${{ inputs.prompt }}
        APPROVALS_INPUT: ${{ inputs.approvals }}
      run: |
        arguments=(-p "${PROMPT_INPUT}")
        case "${APPROVALS_INPUT}" in
          ask) ;;
          always) arguments+=(--auto-approve) ;;
          *) echo "approvals must be ask or always" >&2; exit 2 ;;
        esac
        if [[ -n "${VIBE_ACTION_TEST_RESPONSE:-}" ]]; then
          arguments+=(--fake-response "${VIBE_ACTION_TEST_RESPONSE}")
        fi
        result="$(vibe "${arguments[@]}")"
        printf '%s\n' "${result}"
        delimiter="vibe-result-${RANDOM}-${RANDOM}"
        {
          echo "result<<${delimiter}"
          echo "${result}"
          echo "${delimiter}"
        } >> "${GITHUB_OUTPUT}"
