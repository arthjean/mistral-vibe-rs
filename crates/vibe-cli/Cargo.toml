[package]
name = "vibe-cli"
description = "Programmatic and interactive command-line adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vibe"
path = "src/main.rs"

[features]
# Builds `vibe-app-server-e2e`, which the e2e battery drives; never shipped.
test-fixtures = []

# The app server over stdio, composed as `vibe` composes it
# (`tasks/prd-e2e-test-battery.md`, US-020).
[[bin]]
name = "vibe-app-server-e2e"
path = "tests/fixtures/app_server_e2e.rs"
required-features = ["test-fixtures"]
test = false
bench = false

# The end-to-end battery (`tasks/prd-e2e-test-battery.md` EP-001) runs on its
# own harness, which enters the network jail before any trial runs.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

[dependencies]
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
futures-util.workspace = true
notify.workspace = true
ratatui.workspace = true
regex.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true
vibe-app-server = { path = "../vibe-app-server" }
vibe-core = { path = "../vibe-core" }
vibe-voice = { path = "../vibe-voice" }

[dev-dependencies]
vibe-core = { path = "../vibe-core", features = ["parity-replay"] }
vibe-e2e = { path = "../vibe-e2e" }
vibe-protocol = { path = "../vibe-protocol" }
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["term"] }

[target.'cfg(windows)'.dev-dependencies]
portable-pty.workspace = true

[lints]
workspace = true
