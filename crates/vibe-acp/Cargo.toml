[package]
name = "vibe-acp"
description = "Agent Client Protocol adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vibe-acp"
path = "src/main.rs"

# The end-to-end battery (`tasks/prd-e2e-test-battery.md` EP-001) runs on its
# own harness, which enters the network jail before any trial runs.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
vibe-app-server = { path = "../vibe-app-server" }
vibe-core = { path = "../vibe-core" }
vibe-voice = { path = "../vibe-voice" }
vibe-protocol = { path = "../vibe-protocol" }

[dev-dependencies]
vibe-core = { path = "../vibe-core", features = ["parity-replay"] }
vibe-e2e = { path = "../vibe-e2e" }
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
