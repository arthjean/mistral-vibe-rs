[workspace]
members = [
    "crates/vibe-acp",
    "crates/vibe-app-server",
    "crates/vibe-cli",
    "crates/vibe-compat",
    "crates/vibe-core",
    "crates/vibe-protocol",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/arthurjean/mistral-vibe-rs"

[workspace.dependencies]
clap = { version = "4.5.42", features = ["derive"] }
hex = "0.4.3"
regex = "1.11.1"
schemars = "1.0.4"
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "process", "rt", "sync", "time"] }
toml = "0.9.5"
url = { version = "2.5.4", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"

[workspace.metadata.vibe]
dependency-layers = [
    ["vibe-protocol", "vibe-core"],
    ["vibe-app-server"],
    ["vibe-cli", "vibe-acp"],
    ["vibe-compat"],
]
