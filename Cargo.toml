[workspace]
members = [
    "crates/vibe-acp",
    "crates/vibe-app-server",
    "crates/vibe-cli",
    "crates/vibe-core",
    "crates/vibe-protocol",
]
resolver = "3"

[workspace.package]
version = "2.23.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/arthurjean/mistral-vibe-rs"

[workspace.dependencies]
base64 = "0.23.0"
cap-std = "4.0.2"
clap = { version = "4.6.5", features = ["derive"] }
command-group = { version = "5.0.1", features = ["with-tokio"] }
cpal = "0.18.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.33"
fs2 = "0.4.3"
getrandom = "0.4.1"
hex = "0.4.3"
keyring = "4.1.5"
nix = { version = "0.31.3", features = ["process", "signal"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
schemars = "1.2.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.1.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = { version = "2.5.8", features = ["serde"] }
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"

[workspace.metadata.vibe]
dependency-layers = [
    ["vibe-protocol", "vibe-core"],
    ["vibe-app-server"],
    ["vibe-cli", "vibe-acp"],
]
