[workspace]
members = [
    "crates/vibe-acp",
    "crates/vibe-app-server",
    "crates/vibe-cli",
    "crates/vibe-core",
    "crates/vibe-protocol",
]
resolver = "3"

[workspace.package]
version = "2.23.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/arthurjean/mistral-vibe-rs"

[workspace.dependencies]
base64 = "0.22.1"
cap-std = "4.0.2"
clap = { version = "4.5.42", features = ["derive"] }
command-group = { version = "5.0.1", features = ["with-tokio"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures-util = "0.3.31"
fs2 = "0.4.3"
hex = "0.4.3"
keyring = { version = "3.6.3", default-features = false }
nix = { version = "0.30.1", features = ["process", "signal"] }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm", "underline-color"] }
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1.0.4"
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
shlex = "2.0.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = "0.9.5"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
url = { version = "2.5.4", features = ["serde"] }
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"

[workspace.metadata.vibe]
dependency-layers = [
    ["vibe-protocol", "vibe-core"],
    ["vibe-app-server"],
    ["vibe-cli", "vibe-acp"],
]
