# The Windows CI job runs the suite through nextest, one process per test, so a
# pseudoconsole one test opens cannot hold the pipes of another test running
# beside it in the same process.
# The CI job installs exactly this release.
nextest-version = "0.9.146"

# The console tests type into the TUI at a person's pace and time a paste
# against the bound a person sees on an idle machine, so each runs with no
# other test beside it: under the whole suite's load the session stalls, the
# keys typed meanwhile queue up and read as a paste, and the 10,000-character
# paste measures past 3 s.
[[profile.default.overrides]]
filter = "binary(tui_conpty)"
threads-required = "num-cpus"

# An end-to-end trial is never rerun: a retry would hide the flake it should
# expose (`tasks/prd-e2e-test-battery.md`, US-007). Profile overrides take
# precedence over profile settings, so this holds in `ci` despite its retries.
[[profile.default.overrides]]
filter = "binary(e2e)"
retries = 0

# A test that fails is rerun twice before it fails the job, as the reference
# reruns its last-failed tests, because windows-2022's pseudoconsole host
# sometimes stalls a session's teardown. A rerun that passes is reported as
# flaky in the log. A hung test is ended after five minutes.
[profile.ci]
fail-fast = false
retries = 2
slow-timeout = { period = "60s", terminate-after = 5 }

# A shell tool test settles within seconds, so a stalled pseudoconsole is ended
# after one minute and the rerun starts sooner.
[[profile.ci.overrides]]
filter = "package(vibe-core) & test(/^tools::shell::/)"
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "binary(e2e)"
retries = 0
