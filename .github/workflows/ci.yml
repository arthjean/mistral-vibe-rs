name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    # A hosted runner that stops making progress otherwise holds the job for
    # hours and publishes no log at all, so the run is bounded well above the
    # eight minutes a healthy one takes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # `apt-get update` on the hosted image intermittently stalls, either on an
      # archive fetch or on the lock the image's own apt timer holds. Each
      # attempt is bounded and retried, so a stall costs three minutes and lands
      # in the log rather than hanging the job with nothing to read.
      - name: Install system dependencies
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30; then
              break
            fi
            echo "apt-get update stalled on attempt ${attempt}"
            sleep 15
          done
          sudo timeout 300 apt-get install --no-install-recommends -y libasound2-dev
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Quality gates
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --workspace --all-features
      # The runner has no pinned Python reference, so the surface is diffed
      # against the committed canonical digest. Rerun with output shown so the
      # conformance count lands in the job log.
      - name: Tool-surface conformance
        run: |
          cargo +stable test -p vibe-app-server --all-features tool_surface_parity_tests -- --nocapture
      # Same rule for the configuration surface: the committed corpus is the
      # target, and a registry field arriving without a corpus entry fails here
      # naming the field. Rerun with output shown so the conforming field,
      # scenario and MCP counts land in the job log.
      - name: Configuration-surface conformance
        run: |
          cargo +stable test -p vibe-core --all-features -- --nocapture config::surface_parity_tests config::mcp_parity_tests
      # And for the app-server wire surface: the committed corpus is the target,
      # and a method, notification or response field arriving without one fails
      # here naming what is unmeasured. Rerun with output shown so the per-family
      # conforming counts land in the job log.
      - name: App-server-surface conformance
        run: |
          cargo +stable test -p vibe-app-server --all-features app_server_surface_parity_tests -- --nocapture

  # US-226: the PowerShell installer is the only delivery path no Linux job can
  # execute, so it gets a runner of its own. The job packages a real
  # `windows-x86_64` archive from binaries it just built and drives
  # `scripts/install.ps1` through installation, both refusals, and removal.
  windows-installer:
    name: install.ps1 on Windows
    runs-on: windows-2022
    # The installer's contract is staging, verification and rollback, none of
    # which reads an optimization level, so the job builds unoptimized and
    # without debug info to stay well inside the twenty minutes it is allowed.
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_NET_RETRY: "3"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Build the packaged binaries
        run: cargo +stable build --locked -p vibe-cli -p vibe-acp --bins
      # The version is read from the manifest that owns it rather than written
      # here, so this workflow never becomes another copy of the literal.
      - name: Package windows-x86_64
        shell: bash
        env:
          VIBE_SKIP_BUILD: "true"
          VIBE_RELEASE_BINARY_DIR: target/debug
        run: |
          version="$(awk '
            /^\[/ { section = $0 }
            section == "[workspace.package]" && /^version = / {
              gsub(/^version = "|"$/, "")
              print
              exit
            }' Cargo.toml)"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          bash scripts/ci/package-release.sh windows-x86_64 "${version}"
      - name: Verify install.ps1 end to end
        shell: pwsh
        run: |
          ./scripts/ci/verify-install-ps1.ps1 `
            -ReleaseDirectory (Join-Path $env:GITHUB_WORKSPACE "dist/release-assets") `
            -Version $env:RELEASE_VERSION `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP "vibe-install") `
            -CompletionDirectory (Join-Path $env:RUNNER_TEMP "vibe-completions")
