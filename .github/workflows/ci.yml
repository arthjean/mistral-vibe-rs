name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Quality gates
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --workspace --all-features
      # The runner has no pinned Python reference, so the surface is diffed
      # against the committed canonical digest. Rerun with output shown so the
      # conformance count lands in the job log.
      - name: Tool-surface conformance
        run: |
          cargo +stable test -p vibe-app-server --all-features tool_surface_parity_tests -- --nocapture
      # Same rule for the configuration surface: the committed corpus is the
      # target, and a registry field arriving without a corpus entry fails here
      # naming the field. Rerun with output shown so the conforming field,
      # scenario and MCP counts land in the job log.
      - name: Configuration-surface conformance
        run: |
          cargo +stable test -p vibe-core --all-features -- --nocapture config::surface_parity_tests config::mcp_parity_tests
