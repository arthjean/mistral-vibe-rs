name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    # A hosted runner that stops making progress otherwise holds the job for
    # hours and publishes no log at all, so the run is bounded well above the
    # half hour the full suite, parity drivers included, takes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # `apt-get update` on the hosted image intermittently stalls, either on an
      # archive fetch or on the lock the image's own apt timer holds. Each
      # attempt is bounded and retried, so a stall costs three minutes and lands
      # in the log rather than hanging the job with nothing to read.
      - name: Install system dependencies
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30; then
              break
            fi
            echo "apt-get update stalled on attempt ${attempt}"
            sleep 15
          done
          sudo timeout 300 apt-get install --no-install-recommends -y libasound2-dev
      # The parity drivers read TOML with `tomllib` (Python 3.11+); the image's
      # own `python3` is 3.10.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Quality gates
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --workspace --all-features
      # The runner has no pinned Python reference, so the surface is diffed
      # against the committed canonical digest. Rerun with output shown so the
      # conformance count lands in the job log.
      - name: Tool-surface conformance
        run: |
          cargo +stable test -p vibe-app-server --all-features tool_surface_parity_tests -- --nocapture
      # Same rule for the configuration surface: the committed corpus is the
      # target, and a registry field arriving without a corpus entry fails here
      # naming the field. Rerun with output shown so the conforming field,
      # scenario and MCP counts land in the job log.
      - name: Configuration-surface conformance
        run: |
          cargo +stable test -p vibe-core --all-features -- --nocapture config::surface_parity_tests config::mcp_parity_tests
      # And for the app-server wire surface: the committed corpus is the target,
      # and a method, notification or response field arriving without one fails
      # here naming what is unmeasured. Rerun with output shown so the per-family
      # conforming counts land in the job log.
      - name: App-server-surface conformance
        run: |
          cargo +stable test -p vibe-app-server --all-features app_server_surface_parity_tests -- --nocapture

  # EP-001 of `tasks/prd-windows-native-support.md`: the four quality gates on
  # Windows. A test that fails there because of a known product defect carries
  # `#[cfg_attr(windows, ignore = "windows: <cause> (US-NNN)")]`, so a red run
  # means a new regression and the remaining backlog is counted in the summary.
  windows-quality:
    name: Quality gates on Windows
    runs-on: windows-2022
    # A healthy run fits in 90 minutes. The test step alone is bounded at 100,
    # so a hung test is canceled with its log still uploaded below.
    timeout-minutes: 140
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # The parity replays drive `python3`, which the hosted Windows image does
      # not put on PATH under that name.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Expose python3
        run: |
          if ! command -v python3 >/dev/null; then
            directory="$(dirname "$(command -v python)")"
            cp "${directory}/python.exe" "${directory}/python3.exe"
          fi
          python3 --version
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Check
        run: cargo +stable check --workspace --all-targets --all-features
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
      # windows-2022's pseudoconsole host can keep another test's pipes open
      # when tests share a process, which hangs that test until the host exits.
      # nextest runs each test in its own process, and its `ci` profile in
      # `.config/nextest.toml` ends a hung test after five minutes.
      - name: Install cargo-nextest
        run: |
          version="$(awk -F'"' '/^nextest-version/ { print $2 }' .config/nextest.toml)"
          archive="cargo-nextest-${version}-x86_64-pc-windows-msvc.tar.gz"
          curl -sSfLO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${version}/${archive}"
          echo "809b01f2c94d031ab6cf5f4d4a4f477c8f51b69c96ab3cb2fe4db7ecb222d0d3  ${archive}" \
            | sha256sum -c -
          tar xzf "${archive}" -C "${HOME}/.cargo/bin"
          cargo nextest --version
      # The AGENTS.md gate from Git Bash, through nextest, then the doctests
      # nextest does not run. The log is written as the run goes, so a step
      # canceled on its timeout still names the last test it started.
      - name: Test
        timeout-minutes: 100
        run: |
          set -o pipefail
          vibe_home="$(mktemp -d)"
          log="${RUNNER_TEMP}/windows-test.log"
          status=0
          env -u FORCE_COLOR -u MISTRAL_API_KEY VIBE_HOME="${vibe_home}" \
            cargo +stable nextest run --profile ci --workspace --all-features --no-fail-fast 2>&1 \
            | tee "${log}" || status=1
          env -u FORCE_COLOR -u MISTRAL_API_KEY VIBE_HOME="${vibe_home}" \
            cargo +stable test --workspace --all-features --doc 2>&1 \
            | tee -a "${log}" || status=1
          exit "${status}"
      - name: Count windows ignore tags
        if: always()
        run: |
          tags="$(grep -rhoE 'ignore = "windows: [^"]*\(US-[0-9]+(, US-[0-9]+)*\)"' crates --include='*.rs' || true)"
          by_design="$(grep -rhoE 'ignore = "windows by design: ' crates --include='*.rs' | grep -c . || true)"
          count="$(printf '%s' "${tags}" | grep -c . || true)"
          {
            echo "### Windows ignore tags: ${count} (plus ${by_design} by design)"
            echo
            printf '%s\n' "${tags}" | grep -oE 'US-[0-9]+' | sort | uniq -c \
              | awk '{ print "- " $2 ": " $1 }'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-test-log
          path: ${{ runner.temp }}/windows-test.log
          if-no-files-found: warn

  # US-226: the PowerShell installer is the only delivery path no Linux job can
  # execute, so it gets a runner of its own. The job packages a real
  # `windows-x86_64` archive from binaries it just built and drives
  # `scripts/install.ps1` through installation, both refusals, and removal.
  windows-installer:
    name: install.ps1 on Windows
    runs-on: windows-2022
    # The installer's contract is staging, verification and rollback, none of
    # which reads an optimization level, so the job builds unoptimized and
    # without debug info to stay well inside the twenty minutes it is allowed.
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_NET_RETRY: "3"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Build the packaged binaries
        run: cargo +stable build --locked -p vibe-cli -p vibe-acp --bins
      # The version is read from the manifest that owns it rather than written
      # here, so this workflow never becomes another copy of the literal.
      - name: Package windows-x86_64
        shell: bash
        env:
          VIBE_SKIP_BUILD: "true"
          VIBE_RELEASE_BINARY_DIR: target/debug
        run: |
          version="$(awk '
            /^\[/ { section = $0 }
            section == "[workspace.package]" && /^version = / {
              gsub(/^version = "|"$/, "")
              print
              exit
            }' Cargo.toml)"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          bash scripts/ci/package-release.sh windows-x86_64 "${version}"
      - name: Verify install.ps1 end to end
        shell: pwsh
        run: |
          ./scripts/ci/verify-install-ps1.ps1 `
            -ReleaseDirectory (Join-Path $env:GITHUB_WORKSPACE "dist/release-assets") `
            -Version $env:RELEASE_VERSION `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP "vibe-install") `
            -CompletionDirectory (Join-Path $env:RUNNER_TEMP "vibe-completions")
