name: Debug control on Windows

on:
  push:
    branches: ["debug/**"]

permissions:
  contents: read

jobs:
  control:
    name: Control, main without the epic
    runs-on: windows-2022
    # A healthy run fits in 90 minutes. The test step alone is bounded at 100,
    # so a hung test is canceled with its log still uploaded below.
    timeout-minutes: 140
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # The parity replays drive `python3`, which the hosted Windows image does
      # not put on PATH under that name.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Expose python3
        run: |
          if ! command -v python3 >/dev/null; then
            directory="$(dirname "$(command -v python)")"
            cp "${directory}/python.exe" "${directory}/python3.exe"
          fi
          python3 --version
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      # windows-2022's pseudoconsole host can keep another test's pipes open
      # when tests share a process, which hangs that test until the host exits.
      # Under nextest every test gets a separate process, and the `ci`
      # profile (`.config/nextest.toml`) stops one that hangs for five minutes.
      - name: Install cargo-nextest
        run: |
          version="$(awk -F'"' '/^nextest-version/ { print $2 }' .config/nextest.toml)"
          archive="cargo-nextest-${version}-x86_64-pc-windows-msvc.tar.gz"
          curl -sSfLO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${version}/${archive}"
          echo "809b01f2c94d031ab6cf5f4d4a4f477c8f51b69c96ab3cb2fe4db7ecb222d0d3  ${archive}" \
            | sha256sum -c -
          tar xzf "${archive}" -C "${HOME}/.cargo/bin"
          cargo nextest --version
      # The AGENTS.md gate from Git Bash, through nextest, then the doctests
      # nextest does not run. The log is written as the run goes, so a step
      # canceled on its timeout still names the last test it started.
      - name: Test
        timeout-minutes: 100
        run: |
          set -o pipefail
          rm -rf target/parity
          vibe_home="$(mktemp -d)"
          log="${RUNNER_TEMP}/windows-test.log"
          status=0
          env -u FORCE_COLOR -u MISTRAL_API_KEY VIBE_HOME="${vibe_home}" \
            cargo +stable nextest run --profile ci --workspace --all-features --no-fail-fast 2>&1 \
            | tee "${log}" || status=1
          env -u FORCE_COLOR -u MISTRAL_API_KEY VIBE_HOME="${vibe_home}" \
            cargo +stable test --workspace --all-features --doc 2>&1 \
            | tee -a "${log}" || status=1
          exit "${status}"
      # The same count as on Linux, with the nextest JUnit report classing
      # every failure.
      - name: Parity measurement summary
        if: always()
        run: |
          python3 scripts/parity/live_summary.py --title "Parity measurement (windows)" \
            --junit target/nextest/ci/junit.xml >> "${GITHUB_STEP_SUMMARY}"
      - name: Count windows ignore tags
        if: always()
        run: |
          tags="$(grep -rhoE 'ignore = "windows: [^"]*\(US-[0-9]+(, US-[0-9]+)*\)"' crates --include='*.rs' || true)"
          by_design="$(grep -rhoE 'ignore = "windows by design: ' crates --include='*.rs' | grep -c . || true)"
          count="$(printf '%s' "${tags}" | grep -c . || true)"
          {
            echo "### Windows ignore tags: ${count} (plus ${by_design} by design)"
            echo
            # No tag left is a count of zero, not a failure.
            { printf '%s\n' "${tags}" | grep -oE 'US-[0-9]+' || true; } | sort | uniq -c \
              | awk '{ print "- " $2 ": " $1 }'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-test-log
          path: ${{ runner.temp }}/windows-test.log
          if-no-files-found: warn

  # The rewind replay alone, three times, on the tree under review.
  rewind-alone:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 5ee7743bf00c8e0d0105ebf599349bdac98af80f
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Expose python3
        run: |
          if ! command -v python3 >/dev/null; then
            directory="$(dirname "$(command -v python)")"
            cp "${directory}/python.exe" "${directory}/python3.exe"
          fi
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-nextest
        run: |
          version="$(awk -F'"' '/^nextest-version/ { print $2 }' .config/nextest.toml)"
          archive="cargo-nextest-${version}-x86_64-pc-windows-msvc.tar.gz"
          curl -sSfLO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${version}/${archive}"
          echo "809b01f2c94d031ab6cf5f4d4a4f477c8f51b69c96ab3cb2fe4db7ecb222d0d3  ${archive}" \
            | sha256sum -c -
          tar xzf "${archive}" -C "${HOME}/.cargo/bin"
      - name: Rewind replay, three times
        run: |
          vibe_home="$(mktemp -d)"
          status=0
          for attempt in 1 2 3; do
            env -u FORCE_COLOR -u MISTRAL_API_KEY VIBE_HOME="${vibe_home}" \
              cargo +stable nextest run --profile ci -p vibe-app-server --all-features \
              -E 'binary(rewind_parity_tests)' || status=1
          done
          exit "${status}"
